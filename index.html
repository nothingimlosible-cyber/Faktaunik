    function startMining() {
        const log = document.getElementById('log');
        log.innerHTML = "Memulai sinkronisasi 500 data...<br>";
        dataPool = "";
        document.getElementById('btnDl').style.display = "none";
        
        let count = 0;
        const process = setInterval(() => {
            if (count < sourceData.length) {
                const item = sourceData[count];
                const line = item.t + "\n" + item.s + "\n---\n";
                dataPool += line;
                
                const div = document.createElement('div');
                div.className = "item-log";
                div.innerText = "[OK] Menambang: " + item.t;
                log.appendChild(div);
                log.scrollTop = log.scrollHeight;
                count++;
            } else {
                clearInterval(process);
                log.innerHTML += "<br>✅ SELESAI! 500 data unik berhasil dikumpulkan.";
                document.getElementById('btnDl').style.display = "block";
            }
        }, 2); // Sangat cepat
    }

    function downloadFile() {
        const blob = new Blob([dataPool], { type: 'text/plain' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'tambang.txt';
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
    }
</script>
