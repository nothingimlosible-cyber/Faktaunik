<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Miner - Indonesia</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; padding: 20px; }
      .container { background: #0a0a0a; border: 2px solid #00ffcc; border-radius: 15px; max-width: 800px; margin: auto; padding: 30px; text-align: center; }
        h1 { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
      .stats { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
      .stat-box { background: #111; padding: 15px 30px; border-radius: 10px; border: 1px solid #00ffcc; }
      .stat-number { font-size: 24px; color: #00ffcc; font-weight: bold; }
      .log-box { background: #111; color: #00ffcc; padding: 15px; border-radius: 10px; height: 300px; overflow-y: auto; text-align: left; font-family: monospace; border: 1px solid #333; margin: 20px 0; }
      .btn { padding: 15px 30px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; margin: 5px; }
      .btn-mine { background: #00ffcc; color: #000; }
      .btn-dl { background: #007bff; color: #fff; }
      .btn-clear { background: #ff4444; color: #fff; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .error { color: #ff4444; }
      .success { color: #00ff88; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌐 Miner Indonesia</h1>
    <p>Khusus Wikipedia Indonesia. Klik terus sampe puas.</p>

    <div class="stats">
        <div class="stat-box">
            <div>Total Data Terkumpul</div>
            <div id="totalCount" class="stat-number">0</div>
        </div>
    </div>

    <button id="mineBtn" class="btn btn-mine" onclick="startMining()">⛏️ Tambang 20 Data ID</button>
    <button id="dlBtn" class="btn btn-dl" onclick="downloadTxt()">💾 Download Semua</button>
    <button class="btn btn-clear" onclick="clearData()">🗑️ Reset</button>

    <div id="log" class="log-box">Siap nambang Wikipedia Indonesia...</div>
</div>

<script>
    let dataPool = "";
    let totalData = 0;
    let isMining = false;

    async function fetchWikipediaID(limit = 20) {
        const url = `https://id.wikipedia.org/api/rest_v1/page/random/summary`;
        const results = [];
        const log = document.getElementById('log');

        for(let i = 0; i < limit; i++) {
            try {
                const res = await fetch(url);
                if(!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if(data.title && data.extract && data.extract.length > 50) {
                    results.push({
                        t: data.title,
                        s: data.extract
                    });
                    log.innerHTML += `<div class="success">✓ Dapat: ${data.title}</div>`;
                } else {
                    log.innerHTML += `<div>⚠️ Skip: data kosong</div>`;
                }
            } catch(e) {
                log.innerHTML += `<div class="error">✗ Gagal fetch: ${e.message}</div>`;
            }
            log.scrollTop = log.scrollHeight;
            await new Promise(r => setTimeout(r, 100)); // Kasih jeda biar gak di-block
        }
        return results;
    }

    async function startMining() {
        if(isMining) return;
        isMining = true;

        const log = document.getElementById('log');
        const mineBtn = document.getElementById('mineBtn');
        mineBtn.disabled = true;
        mineBtn.innerText = "⏳ Sedang Nambang...";

        log.innerHTML += "<br>🔍 Mulai sesi tambang Wikipedia ID...<br>";

        const newBatch = await fetchWikipediaID(20);

        newBatch.forEach((item) => {
            totalData++;
            dataPool += `${item.t}\n${item.s}\n---\n`;
        });

        document.getElementById('totalCount').innerText = totalData;
        log.innerHTML += `<div class="success">✅ Sesi selesai. +${newBatch.length} data. Total: ${totalData}</div><br>`;
        log.scrollTop = log.scrollHeight;

        mineBtn.disabled = false;
        mineBtn.innerText = "⛏️ Tambang 20 Data Lagi";
        isMining = false;
    }

    function downloadTxt() {
        if(totalData === 0) {
            alert('Belum ada data yang ditambang kak!');
            return;
        }

        const blob = new Blob([dataPool], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `tambang-indo-${totalData}data.txt`;
        a.click();

        document.getElementById('log').innerHTML += `<div class="success">💾 File ${totalData} data berhasil didownload!</div>`;
    }

    function clearData() {
        if(confirm('Yakin mau reset semua data?')) {
            dataPool = "";
            totalData = 0;
            document.getElementById('totalCount').innerText = 0;
            document.getElementById('log').innerHTML = "Data direset. Siap nambang lagi.";
        }
    }
</script>

</body>
</html>
